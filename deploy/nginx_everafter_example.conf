# Example only. Replace domain, certificate paths and upstream port for your VPS.
server {
    listen 80;
    server_name everafter.example.com www.everafter.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name everafter.example.com www.everafter.example.com;

    # ssl_certificate /etc/letsencrypt/live/everafter.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/everafter.example.com/privkey.pem;

    client_max_body_size 64m;

    location /static/ {
        alias /www/wwwroot/wedding-service/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # If local media is still used, keep this private to Nginx/app as appropriate.
    location /media/ {
        alias /www/wwwroot/wedding-service/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }
}
